
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coco Quiz</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.24.2/dist/css/uikit.min.css">

    <style>
        body {
            background-color: lightpink;
        }

        #quiz-container {
            background-color: white;
            padding: 30px;
            margin-top: 50px;
        }

        h1 {
            color: deeppink;
        }

        label {
            display: block;
            margin: 12px 0;
        }
    </style>
</head>

<body>

    <div id="quiz-container" class="uk-container uk-container-small uk-card uk-card-default uk-card-body">

        <h1>How Well Do You Know Coco?</h1>

        <div id="question"></div>

        <form id="optionsForm">
            <label>
                <input class="uk-radio" type="radio" name="option" value="Pink">
                Pink
            </label>

            <label>
                <input class="uk-radio" type="radio" name="option" value="Blue">
                Blue
            </label>

            <label>
                <input class="uk-radio" type="radio" name="option" value="Green">
                Green
            </label>

            <label>
                <input class="uk-radio" type="radio" name="option" value="Purple">
                Purple
            </label>
        </form>

        <button id="submit" class="uk-button uk-button-primary">Submit</button>

        <div id="result"></div>

    </div>

    <script>
        var questions = [
            {
                question: "What is Coco's favorite color?",
                options: ["Pink", "Blue", "Green", "Purple"],
                answer: "Pink"
            },
            {
                question: "Where did Coco grow up?",
                options: ["Miami", "Denver", "New York City", "Los Angeles"],
                answer: "New York City"
            },
            {
                question: "How many siblings does Coco have?",
                options: ["0", "1", "2", "3"],
                answer: "2"
            },
            {
                question: "What is Coco's dog's name?",
                options: ["Bella", "Chickadee", "Bean", "Daisy"],
                answer: "Bean"
            },
            {
                question: "Where did Coco study abroad?",
                options: ["London", "Rome", "Paris", "Madrid"],
                answer: "Paris"
            }
        ];

        var currentQuestion = 0;
        var score = 0;

        function showQuestion() {
            document.getElementById("question").innerHTML =
                "<h3>" + questions[currentQuestion].question + "</h3>";

            var answers = "";

            for (var i = 0; i < questions[currentQuestion].options.length; i++) {
                answers += "<label><input class='uk-radio' type='radio' name='option' value='" +
                    questions[currentQuestion].options[i] + "'> " +
                    questions[currentQuestion].options[i] + "</label>";
            }

            document.getElementById("optionsForm").innerHTML = answers;
        }

        document.getElementById("submit").onclick = function() {
            var selected = document.querySelector("input[name='option']:checked");

            if (selected == null) {
                document.getElementById("result").innerHTML = "Pick an answer!";
                return;
            }

            if (selected.value == questions[currentQuestion].answer) {
                score++;
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
                document.getElementById("result").innerHTML = "";
            } else {
                document.getElementById("question").innerHTML =
                    "<h3>You got " + score + " out of " + questions.length + " correct!</h3>";

                document.getElementById("optionsForm").innerHTML = "";
                document.getElementById("submit").style.display = "none";
                document.getElementById("result").innerHTML = "Thanks for playing!";
            }
        };

        showQuestion();
    </script>

</body>
</html>
